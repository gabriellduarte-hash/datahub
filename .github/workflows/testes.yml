# A cada envio: os testes do motor e da API, e a checagem de tipos da interface.
name: Testes

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -r requirements-servidor.txt pytest==9.2.0 httpx==0.28.1
      - run: python -m pytest -q

  interface:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # LayoutProps e os tipos das rotas são gerados pelo Next; num clone limpo ainda não existem.
      - run: npx next typegen
      - run: npx tsc --noEmit

  # O mesmo motor dentro do Pyodide, como no site do GitHub Pages: pega cedo
  # qualquer coisa que o navegador não suporta (threads, por exemplo).
  navegador:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: navegador
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: navegador/package-lock.json
      - run: npm ci
      - run: node testar.mjs
