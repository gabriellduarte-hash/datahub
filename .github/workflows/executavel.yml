# A cada versão (git tag v0.2.0 && git push --tags): monta o executável para
# Windows, macOS e Linux, testa cada um e publica na página de Releases.
name: Executável

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Exportar a interface como arquivos estáticos
        working-directory: web
        env:
          DATAHUB_EXPORTAR: "1"
          NEXT_PUBLIC_API_URL: ""
        run: npm ci && npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: interface
          path: web/out

  executavel:
    needs: interface
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, nome: linux-x64 }
          - { os: windows-latest, nome: windows-x64 }
          - { os: macos-latest, nome: macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: interface
          path: web/out
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -r requirements-servidor.txt pyinstaller==6.22.3
      - run: pyinstaller datahub.spec --noconfirm
      - name: Testar o executável
        shell: bash
        run: python .github/testar_executavel.py "dist/tabula-rasa${{ runner.os == 'Windows' && '.exe' || '' }}"
      - name: Compactar
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a "../tabula-rasa-${{ matrix.nome }}.zip" tabula-rasa.exe; else zip "../tabula-rasa-${{ matrix.nome }}.zip" tabula-rasa; fi
      - uses: actions/upload-artifact@v7
        with:
          name: tabula-rasa-${{ matrix.nome }}
          path: tabula-rasa-${{ matrix.nome }}.zip

  publicar:
    needs: executavel
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: pacotes
          pattern: tabula-rasa-*
          merge-multiple: true
      - name: Criar a versão com os executáveis
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" pacotes/*.zip --title "Tabula rasa $GITHUB_REF_NAME" --notes-file .github/notas-da-versao.md
