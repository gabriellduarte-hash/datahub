[project]
name = "datahub"
version = "0.1.0"
description = "Limpeza, normalização e insights de planilhas, sem IA"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0",
    "fastapi>=0.115",
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=9"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["api", "engine", "samples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
